name: TestFlight Deploy

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "빌드할 브랜치 이름"
        required: true
        default: "develop"
      release_notes:
        description: "테스트 노트 (선택)"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup mise and Tuist
        uses: jdx/mise-action@v4
        with:
          mise_toml: |
            [tools]
            tuist = "4.174.2"

      - name: Restore local config files
        env:
          COMMON_XCCONFIG: ${{ secrets.COMMON_XCCONFIG }}
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          set -euo pipefail

          test -n "$COMMON_XCCONFIG"
          test -n "$GOOGLE_SERVICE_INFO_PLIST_B64"

          mkdir -p Configs

          printf '%s\n' "$COMMON_XCCONFIG" > Configs/Common.xcconfig

          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > Configs/GoogleService-Info.plist || \
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 -D > Configs/GoogleService-Info.plist

      - name: Generate project
        run: |
          tuist install
          tuist generate --no-open

      - name: Install certificates and provisioning profile
        env:
          CERTIFICATES_P12_BASE64: ${{ secrets.CERTIFICATES_P12_BASE64 }}
          CERTIFICATES_P12_PASSWORD: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          # 임시 키체인 생성
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 20)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 인증서 설치
          P12_PATH=$RUNNER_TEMP/certificate.p12
          printf '%s' "$CERTIFICATES_P12_BASE64" | base64 --decode > "$P12_PATH" || \
          printf '%s' "$CERTIFICATES_P12_BASE64" | base64 -D > "$P12_PATH"

          security import "$P12_PATH" -P "$CERTIFICATES_P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # 프로비저닝 프로파일 설치
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH" || \
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 -D > "$PP_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(grep -a -A1 'UUID' "$PP_PATH" | grep -v UUID | tr -d ' \n<string></string>')
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID".mobileprovision

      - name: Setup App Store Connect API Key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8 || \
          printf '%s' "$ASC_API_KEY_BASE64" | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Deploy to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: bundle exec fastlane beta

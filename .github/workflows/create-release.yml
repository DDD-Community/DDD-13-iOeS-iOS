name: Create Release

# develop 에서 릴리즈 브랜치를 자르면서 마케팅 버전 상향까지 한 번에 처리한다.
#
# 버전 커밋이 보호 대상인 develop 이 아니라 새로 만드는 release/x.y.z 에 올라가므로
# PR·승인·룰셋 bypass 가 필요 없다. 워크플로가 브랜치를 만들고 그대로 푸시한다.
#
# 이후 흐름은 사람이 진행한다:
#   1. QA 중 나온 수정은 release/x.y.z 로 PR (CI 가 돈다)
#   2. TestFlight Deploy 워크플로를 branch=release/x.y.z 로 실행
#   3. 배포 확정 후 태그 vx.y.z
#   4. release/x.y.z → develop 백머지 PR (버전 + 수정분 회수)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "올릴 단위 (version 을 직접 입력하면 무시됨)"
        type: choice
        required: true
        default: "minor"
        options:
          - patch
          - minor
          - major
      version:
        description: "버전을 직접 지정 (예: 1.3.0). 비우면 bump 기준으로 계산"
        type: string
        required: false
        default: ""
      ticket:
        description: "커밋 제목 prefix 에 쓸 티켓 번호"
        type: string
        required: false
        default: "RELEASE"

# 동시에 두 번 돌면 같은 릴리즈 브랜치를 두고 경합한다.
concurrency:
  group: create-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERSION_FILE: Tuist/ProjectDescriptionHelpers/ProjectEnvironment.swift

jobs:
  create-release:
    # 텍스트 한 줄만 고치므로 Xcode 가 필요 없다.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Resolve versions
        id: version
        run: |
          set -euo pipefail

          current=$(grep -oE 'marketingVersion = "[0-9]+\.[0-9]+\.[0-9]+"' "$VERSION_FILE" \
                    | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$current" ]; then
            echo "::error::$VERSION_FILE 에서 marketingVersion 을 찾지 못했습니다."
            exit 1
          fi

          input_version='${{ inputs.version }}'
          if [ -n "$input_version" ]; then
            if ! printf '%s' "$input_version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version 은 MAJOR.MINOR.PATCH 형식이어야 합니다: $input_version"
              exit 1
            fi
            next="$input_version"
          else
            IFS=. read -r major minor patch <<< "$current"
            case "${{ inputs.bump }}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            next="$major.$minor.$patch"
          fi

          if [ "$next" = "$current" ]; then
            echo "::error::현재 버전과 동일합니다: $current"
            exit 1
          fi

          # 스토어에 출시된 번호는 재사용할 수 없으므로 되돌리는 방향을 막는다.
          lowest=$(printf '%s\n%s\n' "$current" "$next" | sort -V | head -n1)
          if [ "$lowest" = "$next" ]; then
            echo "::error::현재 버전($current)보다 낮습니다: $next"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "::error::이미 v$next 태그가 있습니다. 출시된 버전은 재사용할 수 없습니다."
            exit 1
          fi

          branch="release/$next"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::$branch 브랜치가 이미 있습니다."
            exit 1
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create release branch with version bump
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c '${{ steps.version.outputs.branch }}'

          sed -i -E 's/(marketingVersion = ")[0-9]+\.[0-9]+\.[0-9]+(")/\1${{ steps.version.outputs.next }}\2/' "$VERSION_FILE"

          if git diff --quiet -- "$VERSION_FILE"; then
            echo "::error::치환이 반영되지 않았습니다. $VERSION_FILE 형식이 바뀌었는지 확인하세요."
            exit 1
          fi

          git --no-pager diff -- "$VERSION_FILE"

          git add "$VERSION_FILE"
          git commit -m "[${{ inputs.ticket }}] 버전 ${{ steps.version.outputs.next }}"
          git push origin '${{ steps.version.outputs.branch }}'

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## 릴리즈 브랜치 생성 완료

          | | |
          | --- | --- |
          | 브랜치 | `${{ steps.version.outputs.branch }}` |
          | 버전 | ${{ steps.version.outputs.current }} → **${{ steps.version.outputs.next }}** |

          ### 다음 단계

          1. QA 중 나온 수정은 `${{ steps.version.outputs.branch }}` 로 PR (CI 가 돕니다)
          2. Actions → **TestFlight Deploy** → `branch` 에 `${{ steps.version.outputs.branch }}` 입력
          3. 배포 확정 후 태그 `v${{ steps.version.outputs.next }}`
          4. `${{ steps.version.outputs.branch }}` → `develop` 백머지 PR
          SUMMARY

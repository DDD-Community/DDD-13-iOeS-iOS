name: Crashlytics Discord 알림

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Restore seen issues cache
        uses: actions/cache/restore@v4
        with:
          path: seen_issues.txt
          key: crashlytics-seen-${{ github.run_id }}
          restore-keys: |
            crashlytics-seen-

      - name: Check new crashes and notify Discord
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CRASHLYTICS_WEBHOOK_URL }}
        run: |
          pip install google-auth requests --quiet 2>/dev/null
          python3 - << 'EOF'
import base64
import json
import os
import plistlib
import sys
import requests
import google.auth.transport.requests
from google.oauth2 import service_account

# --- GoogleService-Info.plist에서 Project ID / App ID 추출 ---
plist_b64 = os.environ['GOOGLE_SERVICE_INFO_PLIST_B64']
plist_data = base64.b64decode(plist_b64)
plist = plistlib.loads(plist_data)
PROJECT_ID = plist['PROJECT_ID']
APP_ID = plist['GOOGLE_APP_ID']

DISCORD_WEBHOOK_URL = os.environ['DISCORD_WEBHOOK_URL']

# --- Service Account으로 액세스 토큰 발급 ---
sa_json = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_JSON'])
credentials = service_account.Credentials.from_service_account_info(
    sa_json,
    scopes=['https://www.googleapis.com/auth/cloud-platform'],
)
credentials.refresh(google.auth.transport.requests.Request())
headers = {'Authorization': f'Bearer {credentials.token}'}

# --- Crashlytics 이슈 조회 (최신 20개, Fatal + Non-Fatal) ---
url = f'https://firebasecrashlytics.googleapis.com/v1alpha/projects/{PROJECT_ID}/apps/{APP_ID}/issues'
params = {'pageSize': 20, 'orderBy': 'createTime desc'}
resp = requests.get(url, params=params, headers=headers)

if resp.status_code != 200:
    print(f'API 오류 {resp.status_code}: {resp.text}')
    sys.exit(1)

issues = resp.json().get('issues', [])

# --- seen_issues.txt 로드 (없으면 첫 실행) ---
seen_file = 'seen_issues.txt'
is_first_run = not os.path.exists(seen_file)
seen = set()
if not is_first_run:
    with open(seen_file) as f:
        seen = {line.strip() for line in f if line.strip()}

# --- 새 이슈 필터링 ---
new_issues = [] if is_first_run else [i for i in issues if i.get('issueId') not in seen]

# --- Discord 알림 전송 ---
console_url = f'https://console.firebase.google.com/project/{PROJECT_ID}/crashlytics'

for issue in new_issues:
    issue_type = issue.get('type', 'UNKNOWN')
    is_fatal = issue_type == 'FATAL'
    title = issue.get('title', '알 수 없는 오류')
    subtitle = issue.get('subtitle', '')
    events = issue.get('events', 0)
    users = issue.get('users', 0)

    payload = {
        'embeds': [{
            'title': f"{'🔴 [Fatal]' if is_fatal else '🟡 [Non-Fatal]'} {title}",
            'description': subtitle or None,
            'color': 15548997 if is_fatal else 16776960,
            'fields': [
                {'name': '이벤트', 'value': str(events), 'inline': True},
                {'name': '영향받은 유저', 'value': str(users), 'inline': True},
                {'name': 'Firebase Console', 'value': f'[바로가기]({console_url})', 'inline': True},
            ],
        }]
    }
    requests.post(DISCORD_WEBHOOK_URL, json=payload)
    print(f'알림 전송: {title}')

# --- seen_issues.txt 갱신 ---
all_ids = seen | {i['issueId'] for i in issues if 'issueId' in i}
with open(seen_file, 'w') as f:
    f.write('\n'.join(all_ids))

if is_first_run:
    print(f'첫 실행: {len(all_ids)}개 이슈를 기준으로 저장했습니다.')
else:
    print(f'새 이슈: {len(new_issues)}개')
EOF

      - name: Save seen issues cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_issues.txt
          key: crashlytics-seen-${{ github.run_id }}

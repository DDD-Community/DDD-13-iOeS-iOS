name: Bump Version

# 마케팅 버전을 올려 develop 으로 향하는 PR 을 만들고 auto-merge 를 예약한다.
# 어떤 숫자로 올릴지는 사람이 정하고(제품 결정), 그 뒤의 반복 작업만 자동화한다.
#
# 사람이 하는 일은 PR 승인 클릭 한 번뿐이다. auto-merge 를 켜는 것도 워크플로가 한다.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "올릴 단위 (version 을 직접 입력하면 무시됨)"
        type: choice
        required: true
        default: "minor"
        options:
          - patch
          - minor
          - major
      version:
        description: "버전을 직접 지정 (예: 1.2.0). 비우면 bump 기준으로 계산"
        type: string
        required: false
        default: ""
      ticket:
        description: "커밋/PR 제목 prefix 에 쓸 티켓 번호"
        type: string
        required: false
        default: "RELEASE"

# 동시에 두 번 돌면 같은 버전으로 브랜치가 겹친다.
concurrency:
  group: bump-version
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  VERSION_FILE: Tuist/ProjectDescriptionHelpers/ProjectEnvironment.swift

jobs:
  bump:
    # 텍스트 한 줄만 고치므로 Xcode 가 필요 없다. ubuntu 가 훨씬 빠르고 저렴하다.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Resolve versions
        id: version
        run: |
          set -euo pipefail

          current=$(grep -oE 'marketingVersion = "[0-9]+\.[0-9]+\.[0-9]+"' "$VERSION_FILE" \
                    | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$current" ]; then
            echo "::error::$VERSION_FILE 에서 marketingVersion 을 찾지 못했습니다."
            exit 1
          fi

          input_version='${{ inputs.version }}'
          if [ -n "$input_version" ]; then
            if ! printf '%s' "$input_version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version 은 MAJOR.MINOR.PATCH 형식이어야 합니다: $input_version"
              exit 1
            fi
            next="$input_version"
          else
            IFS=. read -r major minor patch <<< "$current"
            case "${{ inputs.bump }}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            next="$major.$minor.$patch"
          fi

          if [ "$next" = "$current" ]; then
            echo "::error::현재 버전과 동일합니다: $current"
            exit 1
          fi

          # 스토어에 출시된 번호는 재사용할 수 없으므로 되돌리는 방향을 막는다.
          lowest=$(printf '%s\n%s\n' "$current" "$next" | sort -V | head -n1)
          if [ "$lowest" = "$next" ]; then
            echo "::error::현재 버전($current)보다 낮습니다: $next"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "::error::이미 v$next 태그가 있습니다. 출시된 버전은 재사용할 수 없습니다."
            exit 1
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "branch=chore/bump-$next" >> "$GITHUB_OUTPUT"
          echo "### 버전 $current → $next" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply version
        run: |
          set -euo pipefail

          sed -i -E 's/(marketingVersion = ")[0-9]+\.[0-9]+\.[0-9]+(")/\1${{ steps.version.outputs.next }}\2/' "$VERSION_FILE"

          if git diff --quiet -- "$VERSION_FILE"; then
            echo "::error::치환이 반영되지 않았습니다. $VERSION_FILE 형식이 바뀌었는지 확인하세요."
            exit 1
          fi

          git --no-pager diff -- "$VERSION_FILE"

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          branch='${{ steps.version.outputs.branch }}'
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "::error::$branch 브랜치가 이미 있습니다. 이전 실행이 남아 있는지 확인하세요."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$branch"
          git add "$VERSION_FILE"
          git commit -m "[${{ inputs.ticket }}] 버전 ${{ steps.version.outputs.next }}"
          git push origin "$branch"

      - name: Open PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # ${{ }} 는 bash 가 아니라 Actions 가 먼저 치환하므로 quoted heredoc 안에서도 값이 들어간다.
          cat > /tmp/pr-body.md <<'BODY'
          마케팅 버전을 올립니다. `Bump Version` 워크플로가 자동 생성했습니다.

          | | |
          | --- | --- |
          | 이전 | ${{ steps.version.outputs.current }} |
          | 이후 | ${{ steps.version.outputs.next }} |

          `ProjectEnvironment.marketingVersion` 한 줄만 바뀌며, `MARKETING_VERSION` 과
          `CFBundleShortVersionString` 이 이 값을 함께 참조합니다.

          > [!NOTE]
          > `GITHUB_TOKEN` 으로 만든 PR 이라 `pull_request` 워크플로(유닛 테스트·빌드 검증)가
          > 트리거되지 않습니다. 승인 시 diff 한 줄을 직접 확인해 주세요.

          auto-merge 가 예약돼 있어 승인하면 자동으로 머지됩니다.
          BODY

          url=$(gh pr create \
            --base develop \
            --head '${{ steps.version.outputs.branch }}' \
            --title '[${{ inputs.ticket }}] 버전 ${{ steps.version.outputs.next }}' \
            --body-file /tmp/pr-body.md)

          echo "$url"
          echo "PR: $url" >> "$GITHUB_STEP_SUMMARY"

          gh pr merge --auto --squash "$url"
